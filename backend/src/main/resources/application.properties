# ── Database (uses Supabase PostgreSQL in production, H2 locally) ──
spring.datasource.url=${DB_URL:jdbc:h2:mem:medisync_db;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# ── H2 Console (local dev only) ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ──
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ── Server ──
server.port=${PORT:8080}
server.forward-headers-strategy=native

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Groq AI ──
