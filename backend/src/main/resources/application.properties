# ── Memory Optimization ──
spring.main.lazy-initialization=true

# ── Database (HikariCP — uses PgBouncer pooler on 6543 for runtime) ──
spring.datasource.url=jdbc:postgresql://db.bwjmzottkkxrdztqqeju.supabase.co:6543/postgres?prepareThreshold=0&sslmode=require&tcpKeepAlive=true&connectTimeout=60&socketTimeout=60
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=30000



# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false



