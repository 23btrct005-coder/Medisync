jwt.expiration=86400000

# ── Server ──
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# ── File Upload & POST Capacity ──
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-post-size=20MB

# ── Groq AI ──
groq.api.key=${GROQ_API_KEY:}

# ── Gemini AI ──
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ── Spring Mail (Gmail SMTP) ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Brevo Email (HTTP API) ──
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}


# ── MONAI AI Engine ──
monai.service.url=${MONAI_SERVICE_URL:http://localhost:8000}

# ── OpenAI AI ──
openai.api.key=${OPENAI_API_KEY:}

# ── Razorpay ──
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ── LOGGING ──
logging.level.org.hibernate.orm.jdbc.bind=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.orm.jpa=ERROR

# ── Compression ──
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024
