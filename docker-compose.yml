version: '3.8'

services:
  # High-Performance Backend (MediSync Core)
  medisync-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/medisync
      - SPRING_REDIS_HOST=redis
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - clinical-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # Redis for Clinical Memory Engine
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    networks:
      - clinical-network
    ports:
      - "6379:6379"

  # PostgreSQL for Institutional Registries
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=medisync
      - POSTGRES_PASSWORD=institutional_secure_pass
    networks:
      - clinical-network
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Frontend (Vercel-style UI)
  medisync-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://medisync-backend:8080
    depends_on:
      - medisync-backend
    networks:
      - clinical-network

networks:
  clinical-network:
    driver: bridge

volumes:
  pgdata:
