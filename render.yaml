services:
  - type: web
    name: medisync-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/auth/health
    envVars:
      # ── Supabase PostgreSQL Connection ──
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?ssl=true&sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.ctrnxgdtjtllzdfoynwo
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false   # Set this manually in Render dashboard
      # ── App Config ──
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: GROQ_API_KEY
        value: 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
      # ── Brevo Email ──
      - key: BREVO_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: BREVO_SENDER_EMAIL
        sync: false   # Set this manually in Render dashboard
