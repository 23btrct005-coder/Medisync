    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/auth/health
    envVars:
      # ── Supabase PostgreSQL Connection ──
      - key: DB_URL
        value: jdbc:postgresql://db.ctrnxgdtjtllzdfoynwo.supabase.co:6543/postgres?sslmode=require
      - key: DB_DRIVER
        value: org.postgresql.Driver
