        sync: false   # Set this manually in Render dashboard — your Supabase DB password
      # ── App Config ──
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: GROQ_API_KEY
        value: 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
      - key: SERVER_PORT
        value: "8080"
      # ── Brevo Email ──
